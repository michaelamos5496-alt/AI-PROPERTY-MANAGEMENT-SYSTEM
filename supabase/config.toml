# Minimal local Supabase config (supabase CLI). Run `supabase init` to regenerate defaults.
project_id = "property-ai"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/confirm"]
enable_signup = true

[auth.email]
enable_confirmations = true
double_confirm_changes = true

[api]
# The internal `app` schema must never be reachable through the REST API. Only `public` is exposed.
schemas = ["public"]
extra_search_path = ["public"]
