<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Accept invitation · Property AI</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <main id="content" class="auth-page">
    <div class="card auth-card">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">P</span> Property AI</a>
      <h1>Join an organization</h1>
      <div id="missing" hidden><div class="alert alert--error" role="alert">This invitation link is missing or incomplete. Ask your admin for a new one.</div></div>
      <div id="signed-out" hidden><p class="muted">Sign in or create an account using the email address the invitation was sent to.</p><a class="btn btn--block" id="login-link" href="/login">Sign in</a><p></p><a class="btn btn--secondary btn--block" id="register-link" href="/register">Create account</a></div>
      <div id="accept" hidden><p class="muted">You're signed in as <strong id="who"></strong>.</p><form id="form" novalidate><div class="alert alert--error" role="alert" tabindex="-1" data-form-error hidden></div><button class="btn btn--block" type="submit">Accept invitation</button></form><div class="auth-links"><span>Wrong account?</span><button class="btn btn--ghost btn--sm" id="switch" type="button">Sign out</button></div></div>
    </div>
  </main>
  <script type="module" src="/assets/invite.js"></script>
</body>
</html>
