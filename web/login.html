<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · Property AI</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <main id="content" class="auth-page">
    <div class="card auth-card">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">P</span> Property AI</a>
      <h1>Sign in to your workspace</h1>
      <form id="form" novalidate>
        <div class="alert alert--error" role="alert" tabindex="-1" data-form-error hidden></div>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn--block" type="submit">Sign in</button>
      </form>
      <div class="auth-links"><a href="/recover">Forgot password?</a><a href="/register">Create account</a></div>
    </div>
  </main>
  <script type="module" src="/assets/login.js"></script>
</body>
</html>
