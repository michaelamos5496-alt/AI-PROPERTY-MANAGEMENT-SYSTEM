<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Create your organization · Property AI</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <main id="content" class="auth-page">
    <div class="card auth-card">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">P</span> Property AI</a>
      <h1>Create your organization</h1>
      <p id="hello" class="muted"></p>
      <form id="form" novalidate>
        <div class="alert alert--error" role="alert" tabindex="-1" data-form-error hidden></div>
        <div class="field"><label for="name">Organization name</label><input class="input" id="name" name="name" required minlength="2" maxlength="120" placeholder="e.g. Maple Court Apartments" aria-describedby="n-hint"><span class="field__hint" id="n-hint">Your company or portfolio. You'll be the owner and can invite others later.</span></div>
        <button class="btn btn--block" type="submit">Create organization</button>
      </form>
      <div class="auth-links"><span></span><button class="btn btn--ghost btn--sm" id="signout" type="button">Sign out</button></div>
    </div>
  </main>
  <script type="module" src="/assets/onboarding.js"></script>
</body>
</html>
