<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset password · Property AI</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <main id="content" class="auth-page">
    <div class="card auth-card">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">P</span> Property AI</a>
      <h1>Reset your password</h1>
      <form id="form" novalidate>
        <div class="alert alert--error" role="alert" tabindex="-1" data-form-error hidden></div>
        <p class="muted">Enter your email and we'll send you a link to choose a new password.</p>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
        <button class="btn btn--block" type="submit">Send reset link</button>
      </form>
      <div id="done" hidden><div class="alert alert--success" role="status">If an account exists for that address, a reset link is on its way.</div></div>
      <div class="auth-links"><a href="/login">Back to sign in</a></div>
    </div>
  </main>
  <script type="module" src="/assets/recover.js"></script>
</body>
</html>
