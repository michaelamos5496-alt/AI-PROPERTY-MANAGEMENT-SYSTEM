<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Create account · Property AI</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <main id="content" class="auth-page">
    <div class="card auth-card">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">P</span> Property AI</a>
      <h1>Create your account</h1>
      <form id="form" novalidate>
        <div class="alert alert--error" role="alert" tabindex="-1" data-form-error hidden></div>
        <div class="field"><label for="fullName">Full name</label><input class="input" id="fullName" name="fullName" autocomplete="name" maxlength="120"></div>
        <div class="field"><label for="email">Work email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="pw-hint"><span class="field__hint" id="pw-hint">At least 10 characters.</span></div>
        <button class="btn btn--block" type="submit">Create account</button>
      </form>
      <div id="check-email" hidden><div class="alert alert--success" role="status">Check your inbox. We sent a confirmation link to <strong id="sent-to"></strong>.</div><p class="muted small">Open the link to finish creating your account.</p></div>
      <div class="auth-links"><span>Already registered?</span><a href="/login">Sign in</a></div>
    </div>
  </main>
  <script type="module" src="/assets/register.js"></script>
</body>
</html>
