<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Choose a new password · Property AI</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <main id="content" class="auth-page">
    <div class="card auth-card">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">P</span> Property AI</a>
      <h1>Choose a new password</h1>
      <form id="form" novalidate>
        <div class="alert alert--error" role="alert" tabindex="-1" data-form-error hidden></div>
        <div class="field"><label for="password">New password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="10" required><span class="field__hint">At least 10 characters.</span></div>
        <div class="field"><label for="confirm">Confirm password</label><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
        <button class="btn btn--block" type="submit">Update password</button>
      </form>
      <div id="expired" hidden><div class="alert alert--error" role="alert">This reset link has expired or was already used.</div><a class="btn btn--block" href="/recover">Request a new link</a></div>
    </div>
  </main>
  <script type="module" src="/assets/reset-password.js"></script>
</body>
</html>
